name: Release

on:
  release:
    types: [published]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/check_version.py --tag "${GITHUB_REF_NAME}"
      - run: pytest -q
      - run: ruff check src tests scripts/check_openapi_contract.py
      - run: mypy src

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python scripts/check_version.py --tag "${GITHUB_REF_NAME}"
          python -m build
          python -m twine check dist/*
          python -m venv /tmp/openbot-sdk-wheel
          /tmp/openbot-sdk-wheel/bin/pip install dist/*.whl
          /tmp/openbot-sdk-wheel/bin/python -c "import importlib.resources, openbot_sdk; assert importlib.resources.files('openbot_sdk').joinpath('py.typed').is_file()"

      - name: Require production API contract compatibility
        # Run with the built wheel's interpreter: the runner Python does not
        # have openbot_sdk installed, and this also checks the shipped package.
        run: /tmp/openbot-sdk-wheel/bin/python scripts/check_openapi_contract.py https://api.openbot.ai/openapi.json

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/openbot-sdk
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
